{{- if not .Values.auth.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jsreport.authSecretName" . }}
  labels:
    {{- include "jsreport.labels" . | nindent 4 }}
type: Opaque
data:
  admin-password: {{ .Values.auth.adminPassword | b64enc | quote }}
  cookie-secret: {{ .Values.auth.cookieSecret | b64enc | quote }}
{{- end }}
