suite: authentication secret
templates:
  - templates/secret.yaml
tests:
  - it: stores admin password and cookie secret in a secret
    set:
      auth.adminPassword: test-password
      auth.cookieSecret: test-cookie-secret
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-jsreport
      - equal:
          path: data.admin-password
          decodeBase64: true
          value: test-password
      - equal:
          path: data.cookie-secret
          decodeBase64: true
          value: test-cookie-secret

  - it: is not created when an existing secret is used
    set:
      auth.existingSecret: my-jsreport-auth
    asserts:
      - hasDocuments:
          count: 0
